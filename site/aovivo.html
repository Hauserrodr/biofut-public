<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ao vivo · Copa BioFut</title>
<meta name="description" content="As câmeras da Copa BioFut ao vivo.">
<meta property="og:title" content="Copa BioFut ao vivo">
<meta property="og:description" content="As câmeras da Copa BioFut ao vivo.">
<meta property="og:image" content="https://biofut.h-brain.org/og.png">
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css?v=20261023b">
<style>
main.live { max-width: 1200px; margin: 0 auto; padding: 16px; }
main.live h1 { font: 800 clamp(32px, 8vw, 52px)/1 var(--cond); text-transform: uppercase; margin: 6px 0 14px; }
#grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
figure { margin: 0; position: relative; }
#ytf { margin-bottom: 12px; }
#yt { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 12px; display: block; background: #000; }
video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; display: block; }
figcaption { position: absolute; right: 10px; top: 8px; font: 700 14px var(--cond); letter-spacing: .1em; text-transform: uppercase;
             color: #fff; background: #0009; padding: 3px 8px; border-radius: 999px; pointer-events: none; }
figcaption::before { content: "● "; color: #e33; }
.pl { position: absolute; top: 8px; left: 8px; max-width: calc(100% - 70px); box-shadow: 0 0 0 1px #fff3; display: grid; grid-template-columns: 1fr auto 1fr;
      column-gap: 10px; align-items: center; background: #000c; color: #fff; padding: 4px 14px 5px; border-radius: 12px;
      font: 700 16px/1.15 var(--cond); text-transform: uppercase; pointer-events: none; }
.pl[hidden] { display: none; }
.pl span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl span:first-child, .pl small:first-of-type { text-align: right; }
.pl b { font-size: 22px; letter-spacing: .04em; white-space: nowrap; }
.pl small { font: 600 12px var(--cond); opacity: .85; white-space: nowrap; }
.meta { color: var(--mut); font-size: 14px; }
</style>
</head>
<body>
<main class="live">
  <div class="kicker">Copa BioFut</div>
  <h1>Ao vivo</h1>
  <p class="meta" id="none">Nenhuma câmera no ar agora. A página atualiza sozinha.</p>
  <figure id="ytf" hidden><iframe id="yt" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Câmera principal no YouTube"></iframe><div class="pl" hidden></div></figure>
  <div id="grid"></div>
  <p class="meta">Toque no vídeo para ligar o som. <a id="ytl" hidden target="_blank" rel="noopener">Abrir no YouTube</a></p>
</main>
<script>
const players = new Map();  // cam -> {fig, pc}

async function watch(cam) {
  const fig = document.createElement('figure');
  const v = Object.assign(document.createElement('video'), { autoplay: true, muted: true, playsInline: true });
  v.onclick = () => { v.muted = !v.muted; v.play(); };
  const cap = document.createElement('figcaption');
  cap.textContent = cam.replace(/^cam-/, '');
  fig.append(v, cap, Object.assign(document.createElement('div'), { className: 'pl', hidden: !bar, innerHTML: bar }));
  document.getElementById('grid').append(fig);
  const p = { fig, pc: null };
  players.set(cam, p);
  const pc = p.pc = new RTCPeerConnection();
  pc.addTransceiver('video', { direction: 'recvonly' });
  pc.addTransceiver('audio', { direction: 'recvonly' });
  pc.ontrack = (e) => { if (v.srcObject !== e.streams[0]) v.srcObject = e.streams[0]; };
  pc.onconnectionstatechange = () => pc.connectionState === 'failed' && drop(cam);
  try {
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise((ok) => {
      if (pc.iceGatheringState === 'complete') return ok();
      pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && ok();
      setTimeout(ok, 3000);
    });
    const r = await fetch(`/mtx/${cam}/whep`, { method: 'POST', body: pc.localDescription.sdp, headers: { 'Content-Type': 'application/sdp' } });
    if (!r.ok) throw new Error(r.status);
    await pc.setRemoteDescription({ type: 'answer', sdp: await r.text() });
  } catch { drop(cam); }  // the next poll tries again
}

function drop(cam) {
  const p = players.get(cam);
  if (!p) return;
  p.pc?.close(); p.fig.remove(); players.delete(cam);
}

// The main camera plays from YouTube (it carries the viewers, not this server); the other cameras play from here.
let yt = '', ytSince = 0;
fetch('/api/stream').then((r) => r.json()).then((s) => {
  yt = s.yt || '';
  if (yt) Object.assign(document.getElementById('ytl'), { href: `https://www.youtube.com/channel/${encodeURIComponent(yt)}/live`, hidden: false });
  poll();
}).catch(() => {});

function youtube(on) {
  const f = document.getElementById('yt'), box = f.parentNode;
  if (!on) { ytSince = 0; box.hidden = true; f.removeAttribute('src'); return; }
  ytSince ||= Date.now();
  if (box.hidden && Date.now() - ytSince > 20000) {  // YouTube needs a few seconds after the push starts to go live
    f.src = `https://www.youtube.com/embed/live_stream?channel=${encodeURIComponent(yt)}&autoplay=1&mute=1`;
    box.hidden = false;
  }
}

async function poll() {
  try {
    let cams = await (await fetch('/api/cams')).json();
    const main = cams.includes('cam-principal');
    if (yt) { youtube(main); cams = cams.filter((c) => c !== 'cam-principal'); }
    for (const c of players.keys()) if (!cams.includes(c)) drop(c);
    for (const c of cams) if (!players.has(c)) watch(c);
    document.getElementById('none').hidden = cams.length > 0 || (yt && main);
  } catch {}
}
setInterval(poll, 10000);

// The score bar over each player: the live Copa game from /api/copa (the staff's buttons on #/copa). It hides between games.
let bar = '';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (ch) => `&#${ch.charCodeAt(0)};`);
async function placar() {
  try {
    const j = (await (await fetch('/api/copa')).json()).jogos.find((x) => x.status === 'ao_vivo');
    const n = (s, t) => j.eventos.filter((e) => e.time === s && e.tipo === t).length;
    const lado = (s) => [`Faltas ${n(s, 'falta')}`, n(s, 'amarelo') && `🟨 ${n(s, 'amarelo')}`, n(s, 'vermelho') && `🟥 ${n(s, 'vermelho')}`].filter(Boolean).join(' · ');
    bar = j ? `<span>${esc(j.a)}</span><b>${j.gols_a} × ${j.gols_b}</b><span>${esc(j.b)}</span><small>${lado('a')}</small><small></small><small>${lado('b')}</small>` : '';
  } catch {}  // keep the last bar until the next poll
  document.querySelectorAll('figure .pl').forEach((d) => { d.innerHTML = bar; d.hidden = !bar; });
}
placar();
setInterval(placar, 15000);
</script>
</body>
</html>
