<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transmitir · BioFut</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css?v=20261023b">
<style>
main.cam { max-width: 520px; margin: 0 auto; padding: 16px; }
main.cam h1 { font: 800 clamp(32px, 9vw, 48px)/1 var(--cond); text-transform: uppercase; margin: 6px 0 14px; }
label { display: block; font: 600 13px var(--cond); letter-spacing: .14em; text-transform: uppercase; color: var(--mut); margin: 12px 0 6px; }
input, select { width: 100%; height: 48px; font-size: 20px; box-sizing: border-box; }
.meta { color: var(--mut); font-size: 14px; }
.err { color: var(--loss); font-size: 15px; min-height: 1.3em; margin-top: 8px; }
video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; display: block; }
.state { font: 700 15px var(--cond); letter-spacing: .1em; text-transform: uppercase; margin: 10px 0; }
.state.on { color: var(--win, #3c3); }
.state.on::before { content: "● "; }
.btn { width: 100%; height: 52px; margin-top: 14px; }
.marks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.marks button { height: 84px; font: 800 26px var(--cond); text-transform: uppercase; letter-spacing: .05em; }
.marks button[data-kind="gol"] { grid-column: 1 / -1; height: 104px; font-size: 38px; }
.marks button:active { transform: scale(.97); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="cam">
  <div class="kicker">Copa BioFut · câmera</div>
  <h1>Transmitir</h1>
  <form id="setup">
    <label for="pin">PIN de transmissão</label>
    <input id="pin" inputmode="numeric" autocomplete="off" required>
    <label for="name">Câmera</label>
    <select id="name">
      <option value="principal">Câmera 1 · principal</option>
      <option value="biofut-2">Câmera 2</option>
      <option value="biofut-3">Câmera 3</option>
      <option value="biofut-4">Câmera 4</option>
    </select>
    <label for="q">Qualidade</label>
    <select id="q">
      <option value="480,800">Baixa · 480p</option>
      <option value="720,1500" selected>Média · 720p</option>
      <option value="720,2500">Alta · 720p</option>
      <option value="1080,4000">Máxima · 1080p</option>
    </select>
    <p class="meta" id="gb"></p>
    <p class="meta">Cada câmera vai para a sua transmissão no YouTube. Use o número do tripé. Celular na horizontal, carregador ligado.</p>
    <button class="btn">Começar a transmitir</button>
    <button class="btn" type="button" id="only">Só marcar lances (sem câmera)</button>
    <div class="err" id="err"></div>
  </form>
  <section id="live" hidden>
    <video id="v" autoplay muted playsinline></video>
    <div class="state" id="state">conectando…</div>
    <div class="marks">
      <button data-kind="gol">⚽ Gol</button>
      <button data-kind="falta">Falta</button>
      <button data-kind="escanteio">Escanteio</button>
      <button data-kind="lateral">Lateral</button>
      <button data-kind="lance">⭐ Lance</button>
    </div>
    <p class="meta">Aperte na hora, olhando o campo: cada marca vira um corte do vídeo. Sem sinal, a marca espera no celular e sai depois com a hora certa.</p>
    <p class="meta" id="clock"></p>
    <div class="err" id="err2"></div>
    <button class="btn" id="stop">Parar</button>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const store = { get: (k) => { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
$('pin').value = store.get('cam_pin');
$('name').value = new URLSearchParams(location.search).get('cam') || store.get('cam_name') || 'principal';  // the tripod QR opens ?cam=<its camera>
if (!$('name').value) $('name').value = 'principal';  // an old saved name that is not on the list
$('q').value = store.get('cam_q') || $('q').value;
let media, pc, slug, pin, wake, running = false, retry, off = 0, synced = false;

const show = (s, on) => { $('state').textContent = s; $('state').classList.toggle('on', !!on); };
const quality = () => $('q').value.split(',').map(Number);  // [height, video kbps]
function gb() {  // the phone's upload: the video cap plus about 64 kbps of audio
  const h = (quality()[1] + 64) * 3600 / 8 / 1e6;
  $('gb').textContent = `Usa até ${h.toFixed(1).replace('.', ',')} GB de dados por hora (${Math.round(h * 8)} GB num dia de 8 h).`;
}
$('q').onchange = () => { store.set('cam_q', $('q').value); gb(); };
gb();

async function sync() {  // the phone's clock against the server's (NTP): the best of 3 round trips
  let best;
  for (let i = 0; i < 3; i++) {
    const a = Date.now();
    try {
      const { t } = await (await fetch('/api/stream', { cache: 'no-store' })).json();
      const b = Date.now();
      if (!best || b - a < best.rtt) best = { rtt: b - a, off: t * 1000 + (b - a) / 2 - b };
    } catch {}
  }
  if (best) { off = Math.round(best.off); synced = true; }
  $('clock').textContent = synced
    ? `Relógio acertado pela internet (o celular estava ${off >= 0 ? 'atrasado' : 'adiantado'} ${Math.abs(off / 1000).toFixed(1).replace('.', ',')} s).`
    : 'Relógio ainda não acertado (sem sinal): as marcas usam a hora do celular.';
}
setInterval(() => running && sync(), 300000);

async function keepAwake() {
  try { if (running && 'wakeLock' in navigator && document.visibilityState === 'visible') wake = await navigator.wakeLock.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', keepAwake);

async function publish() {
  clearTimeout(retry);
  if (pc) pc.close();
  pc = new RTCPeerConnection();
  for (const t of media.getTracks())
    pc.addTransceiver(t, { direction: 'sendonly', streams: [media],
                           sendEncodings: t.kind === 'video' ? [{ maxBitrate: quality()[1] * 1000 }] : undefined });
  // H264 first: YouTube takes it without re-encoding (the server only copies the video)
  const caps = RTCRtpSender.getCapabilities?.('video')?.codecs || [];
  const h264 = caps.filter((c) => /h264/i.test(c.mimeType))
                   .sort((a, b) => /packetization-mode=1/.test(b.sdpFmtpLine) - /packetization-mode=1/.test(a.sdpFmtpLine));
  const vt = pc.getTransceivers().find((t) => t.sender.track?.kind === 'video');
  if (h264.length && vt?.setCodecPreferences) vt.setCodecPreferences([...h264, ...caps.filter((c) => !/h264/i.test(c.mimeType))]);
  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if (s === 'connected') show('ao vivo', true);
    if (s === 'failed' || s === 'disconnected') again('sinal caiu, reconectando…');
  };
  await pc.setLocalDescription(await pc.createOffer());
  await new Promise((ok) => {  // no trickle: send every candidate in the offer
    if (pc.iceGatheringState === 'complete') return ok();
    pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && ok();
    setTimeout(ok, 3000);
  });
  const r = await fetch(`/mtx/cam-${slug}/whip`, { method: 'POST', body: pc.localDescription.sdp,
    headers: { 'Content-Type': 'application/sdp', Authorization: 'Basic ' + btoa('cam:' + pin) } });
  if (r.status === 401) throw new Error('PIN de transmissão errado');
  if (!r.ok) throw new Error(`servidor respondeu ${r.status}`);
  await pc.setRemoteDescription({ type: 'answer', sdp: await r.text() });
}

function again(msg) {
  if (!running) return;
  show(msg);
  clearTimeout(retry);
  retry = setTimeout(() => publish().catch((e) => again(e.message + ', tentando de novo…')), 3000);
}

function begin() {
  $('err').textContent = '';
  pin = $('pin').value.trim();
  slug = $('name').value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 24);
  if (!slug) { $('err').textContent = 'nome inválido'; return false; }
  store.set('cam_pin', pin); store.set('cam_name', $('name').value.trim());
  sync().then(flush);
  return true;
}

$('only').onclick = () => {  // a phone on the sideline: marks only, no camera, no video upload
  if (!$('setup').reportValidity() || !begin()) return;
  running = true; media = null;
  $('v').hidden = true; $('setup').hidden = true; $('live').hidden = false;
  show('só marcando lances', true);
  keepAwake();
};

$('setup').onsubmit = async (e) => {
  e.preventDefault();
  if (!begin()) return;
  const [h] = quality();
  try {
    media = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: Math.round(h * 16 / 9) }, height: { ideal: h }, frameRate: { ideal: 30 } },
      audio: { echoCancellation: false, noiseSuppression: false } });
  } catch (err) { return ($('err').textContent = 'sem acesso à câmera: ' + err.message); }
  $('v').srcObject = media;
  running = true;
  $('v').hidden = false; $('setup').hidden = true; $('live').hidden = false;
  keepAwake();
  show('conectando…');
  try { await publish(); }
  catch (err) {
    if (/PIN/.test(err.message)) { stop(); return ($('err').textContent = err.message); }
    again(err.message + ', tentando de novo…');
  }
};

function stop() {
  running = false; clearTimeout(retry);
  if (pc) pc.close();
  media?.getTracks().forEach((t) => t.stop());
  media = null;
  try { wake?.release(); } catch {}
  $('setup').hidden = false; $('live').hidden = true;
}
$('stop').onclick = stop;

// Marks wait in the phone (localStorage) until the server takes them: no signal loses nothing, t keeps the moment of the tap.
const queue = () => { try { return JSON.parse(store.get('lance_q') || '[]'); } catch { return []; } };
let sending = false;
async function flush() {
  if (sending || !pin) return;
  sending = true;
  try {
    for (let m; (m = queue()[0]);) {
      let r;
      try {
        r = await fetch('/api/lance', { method: 'POST', body: JSON.stringify(m),
          headers: { 'Content-Type': 'application/json', 'X-Stream-Pin': pin } });
      } catch { break; }  // no signal: the next flush tries again
      if (!r.ok) { $('err2').textContent = r.status === 403 ? 'PIN de transmissão errado: as marcas esperam no celular' : 'servidor respondeu ' + r.status; break; }
      store.set('lance_q', JSON.stringify(queue().filter((x) => x.id !== m.id)));
      $('err2').textContent = '';
    }
  } finally {
    sending = false;
    const n = queue().length;
    if (n && !$('err2').textContent) $('err2').textContent = `${n} marca${n > 1 ? 's' : ''} esperando sinal`;
  }
}
setInterval(() => running && flush(), 15000);

for (const b of document.querySelectorAll('.marks button')) b.onclick = () => {
  navigator.vibrate?.(80);
  const now = Date.now();
  store.set('lance_q', JSON.stringify([...queue(), { id: now + Math.random(), kind: b.dataset.kind, t: (now + off) / 1000,
    off: synced ? off : null, cam: media ? slug : '', sender: slug }]));
  const label = b.textContent;
  b.textContent = '✓';
  setTimeout(() => (b.textContent = label), 1200);
  flush();
};
</script>
</body>
</html>
